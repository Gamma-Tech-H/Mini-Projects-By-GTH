<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="display">
            <h4 id="result">0</h4>
        </div>
        <div id="buttons">
            <button class="operator" id="btnplus">+</button>
            <button class="operator" id="btnminus">-</button>
            <button class="operator" id="btnproduct">*</button>
            <button class="operator" id="btndivision">÷</button>
            <button class="number" id="btn7">7</button>
            <button class="number" id="btn8">8</button>
            <button class="number" id="btn9">9</button>
            <button class="equal" id="btnequal">=</button>
            <button class="number" id="btn4">4</button>
            <button class="number" id="btn5">5</button>
            <button class="number" id="btn6">6</button>
            <button class="number" id="btn1">1</button>
            <button class="number" id="btn2">2</button>
            <button class="number" id="btn3">3</button>
            <button class="number" id="btn.">.</button>
            <button class="number" id="btn0">0</button>
            <button class="clear" id="btnclear">C</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
